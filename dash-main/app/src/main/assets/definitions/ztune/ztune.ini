; ============================================================================
[Dialog]
; ============================================================================

    dialog = std_fuel, "Fuel Constants", xAxis
        field = "Displacement",       displCc
        field = "Injector Flow",       injFlowCcMin
        field = "Stoich AFR",          stoichAfr
        field = "Cylinders",           nCyl

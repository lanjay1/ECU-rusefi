; ============================================================================
; ZTune-ECU Motor 1-Silinder INI Definition (v1.2.0)
; ============================================================================
; Comprehensive INI for ZTune-ECU ESP32-S3 1-cylinder motorcycle ECU.
; Covers all v1.2.0 features:
;   - Fuel: VE Table, AFR Target, deadtime curve, dual injector stage2 fraction
;   - Ignition: Spark Advance, Dwell 2D, Rev limit soft+hard
;   - Cranking: PW vs CLT, prime pulse
;   - Idle: duty vs CLT, PWM freq
;   - Sensors: TPS/CLT/IAT/O2 calibration curves
;   - Trigger: tooth count, missing, edge, TDC offset (calibrate via cmd)
;   - CMP: enable/disable, edge, angle (cam sensor optional)
;   - Knock: enable, bore, freq auto/manual, threshold, window, retard, fuel trim
;   - VVA: mode OFF/SINGLE/DUAL, activation RPM/TPS/CLT/AFR, fuel/timing adder
;   - Valvetronic: mode OFF/BUTTON/AUTO, RPM/TPS thresholds
;   - Coolant pump / EWP: mode MECHANICAL/PWM/ONOFF, curve CLT->duty, soft-start
;   - Quickshifter: enable, sensor/button mode, threshold, 3D cut table (gear x RPM),
;     sensitivity per gear, arming RPM/TPS, ignition retard
;
; Signature "ZTune 1.2.0" matches firmware version string.
; ============================================================================
; NOTE: this INI uses a simplified flat-memory layout where each "page" is
; a JSON-equivalent snapshot. The actual firmware uses JSON transport via
; CMD_READ_TUNE/CMD_WRITE_TUNE, so offsets here are only for the UI's
; display grouping — they are not literal NVS byte offsets. LibreTune's
; ZTuneEcu adapter (see EcuFactory.kt) maps these groups to JSON keys.
; ============================================================================

[MegaTune]
    queryCommand = "Q"
    signature    = "ZTune 1.2.0"
    versionInfo  = ""
    iniSpecVersion = "3.64"
    ecuType = ztune

ecuType      = ztune
    endianness   = little
    nPages       = 1
    pageSize     = 4096
    blockSize    = 1024

[Constants]
    ; 1 page virtual (snapshot JSON tune), diindeks 0
    page = 0

    ; ---- Trigger ----
    trigTotalTeeth  = bits, U08, 0, [4:60], "teeth", 1.0, 0.0
    trigMissingTeeth= bits, U08, 1, [1:5], "teeth", 1.0, 0.0
    trigOffsetTDC   = bits, S16, 2, [-360:720], "deg", 0.1, 0.0
    trigEdge        = bits, U08, 4, [0:1], "", 1.0, 0.0     ; 0=FALLING, 1=RISING

    ; ---- CMP (v1.2.0) ----
    cmpEnable       = bits, U08, 5, [0:1], "", 1.0, 0.0
    cmpEdge         = bits, U08, 6, [0:1], "", 1.0, 0.0
    cmpAngleDeg     = bits, S16, 8, [0:720], "deg", 0.1, 0.0

    ; ---- Engine ----
    displCc         = bits, U16, 10, [30:1500], "cc", 1.0, 0.0
    injFlowCcMin    = bits, U16, 12, [50:3000], "cc/min", 1.0, 0.0
    stoichAfr       = bits, U08, 14, [12:16], ":1", 0.1, 0.0
    nCyl            = bits, U08, 15, [1:1], "cyl", 1.0, 0.0

    ; ---- Rev limit ----
    revSoftRpm      = bits, U16, 16, [1000:20000], "RPM", 1.0, 0.0
    revHardRpm      = bits, U16, 18, [1000:22000], "RPM", 1.0, 0.0
    revHystRpm      = bits, U16, 20, [50:1000], "RPM", 1.0, 0.0

    ; ---- Idle ----
    idleParkDuty    = bits, U08, 22, [0:90], "%", 1.0, 0.0
    idleHystPct     = bits, U08, 23, [0:10], "%", 0.1, 0.0
    idlePwmFreq     = bits, U16, 24, [50:1000], "Hz", 1.0, 0.0

    ; ---- Cranking ----
    crankingRpm     = bits, U16, 26, [100:1000], "RPM", 1.0, 0.0

    ; ---- DFCO ----
    dfcoRpmEnter    = bits, U16, 28, [500:8000], "RPM", 1.0, 0.0
    dfcoRpmExit     = bits, U16, 30, [300:6000], "RPM", 1.0, 0.0
    dfcoTpsPct      = bits, U08, 32, [0:20], "%", 0.1, 0.0

    ; ---- Closed-loop O2 ----
    o2Enable        = bits, U08, 33, [0:1], "", 1.0, 0.0
    o2Kp            = bits, U08, 34, [0:10], "", 0.1, 0.0
    o2Ki            = bits, U08, 35, [0:5], "", 0.01, 0.0
    o2TrimMaxPct    = bits, U08, 36, [0:50], "%", 1.0, 0.0
    o2MinRpm        = bits, U16, 38, [0:5000], "RPM", 1.0, 0.0
    o2CltMinC       = bits, U08, 40, [0:100], "C", 1.0, 0.0

    ; ---- Sensor calibration scalars ----
    tpsAdcMin       = bits, U16, 42, [0:4095], "adc", 1.0, 0.0
    tpsAdcMax       = bits, U16, 44, [0:4095], "adc", 1.0, 0.0
    vbatRatio       = bits, U16, 46, [0:65535], "", 0.0001, 0.0

    ; ---- Timing injection ----
    injEndBeforeTdcDeg = bits, U08, 48, [0:180], "deg", 0.5, 0.0

    ; ---- Knock ----
    knEnable        = bits, U08, 49, [0:1], "", 1.0, 0.0
    knBoreMm        = bits, U08, 50, [30:120], "mm", 1.0, 0.0
    knFreqAuto      = bits, U08, 51, [0:1], "", 1.0, 0.0
    knFreqKhz       = bits, U08, 52, [2:25], "kHz", 0.1, 0.0
    knThresholdDb   = bits, S08, 53, [-20:20], "dB", 0.5, 0.0
    knWinBeforeDeg = bits, U08, 54, [0:30], "deg", 0.5, 0.0
    knWinAfterDeg  = bits, U08, 55, [0:90], "deg", 0.5, 0.0
    knAggressionPct = bits, U08, 56, [1:100], "%", 1.0, 0.0
    knMaxRetardDeg  = bits, U08, 57, [0:20], "deg", 0.5, 0.0
    knRecoverDegPerS= bits, U08, 58, [0:10], "deg/s", 0.1, 0.0
    knFuelTrimPct   = bits, U08, 59, [0:30], "%", 0.5, 0.0

    ; ---- Dual injector (v1.2.0) ----
    injMode         = bits, U08, 60, [0:1], "", 1.0, 0.0    ; 0=SINGLE, 1=DUAL_STAGE
    inj2FlowCcMin   = bits, U16, 62, [50:5000], "cc/min", 1.0, 0.0

    ; ---- VVA (v1.2.0) ----
    vvaMode         = bits, U08, 64, [0:2], "", 1.0, 0.0    ; 0=OFF, 1=SINGLE, 2=DUAL
    vvaActivationRpm = bits, U16, 66, [0:15000], "RPM", 1.0, 0.0
    vvaDeactivationRpm = bits, U16, 68, [0:15000], "RPM", 1.0, 0.0
    vvaMinTps       = bits, U08, 70, [0:100], "%", 1.0, 0.0
    vvaMinClt       = bits, U08, 71, [0:120], "C", 1.0, 0.0
    vvaMaxAfr       = bits, U08, 72, [0:18], "AFR", 0.1, 0.0    ; 0 = skip cek
    vvaFuelAdderPct = bits, U08, 73, [0:30], "%", 0.5, 0.0
    vvaIgnRetardDeg = bits, U08, 74, [0:15], "deg", 0.5, 0.0

    ; ---- Valvetronic (v1.2.0) ----
    valvetronicMode = bits, U08, 75, [0:2], "", 1.0, 0.0   ; 0=OFF, 1=BUTTON, 2=AUTO
    valvetronicAutoRpm    = bits, U16, 76, [0:15000], "RPM", 1.0, 0.0
    valvetronicAutoTps    = bits, U08, 78, [0:100], "%", 1.0, 0.0
    valvetronicAutoOffRpm = bits, U16, 80, [0:15000], "RPM", 1.0, 0.0

    ; ---- EWP (v1.2.0) ----
    ewpMode         = bits, U08, 82, [0:2], "", 1.0, 0.0  ; 0=MECH, 1=PWM, 2=ONOFF
    ewpPwmFreq      = bits, U16, 84, [50:1000], "Hz", 1.0, 0.0
    ewpSoftStartSec = bits, U08, 86, [0:10], "s", 0.1, 0.0
    ewpMinDutyPct   = bits, U08, 87, [0:100], "%", 1.0, 0.0
    ewpMaxDutyPct   = bits, U08, 88, [0:100], "%", 1.0, 0.0
    ewpOnTemp       = bits, U08, 89, [40:120], "C", 1.0, 0.0
    ewpOffTemp      = bits, U08, 90, [40:120], "C", 1.0, 0.0

    ; ---- Quickshifter (v1.2.0) ----
    qsEnable        = bits, U08, 91, [0:1], "", 1.0, 0.0
    qsActivationMode= bits, U08, 92, [0:1], "", 1.0, 0.0   ; 0=SENSOR, 1=BUTTON
    qsInvertLogic   = bits, U08, 93, [0:1], "", 1.0, 0.0
    qsSensorThreshold = bits, U16, 94, [0:4095], "adc", 1.0, 0.0
    qsSensorBaseline  = bits, U16, 96, [0:4095], "adc", 1.0, 0.0
    qsArmingRpm     = bits, U16, 98, [0:15000], "RPM", 1.0, 0.0
    qsArmingTps     = bits, U08, 100, [0:100], "%", 1.0, 0.0
    qsIgnitionRetardDeg = bits, U08, 101, [0:20], "deg", 0.5, 0.0

    ; ---- Misc ----
    tachEnable      = bits, U08, 102, [0:1], "", 1.0, 0.0
    pumpPrimeMs     = bits, U16, 104, [0:10000], "ms", 1.0, 0.0
    useIatCorr      = bits, U08, 106, [0:1], "", 1.0, 0.0
    telemRateHz     = bits, U08, 107, [2:30], "Hz", 1.0, 0.0

; ============================================================================
; Axis bins & tables — offset 200+ (reserved for arrays)
; ============================================================================
[Constants]
    page = 0

    ; VE table 16x16 — RPM max 14000 (v1.2.1)
    veRpmBins        = array, U16, 200, [16], "RPM", 1.0, 0.0, 800, 14000
    veLoadBins       = array, U16, 232, [16], "%", 1.0, 0.0
    veTable          = array, U08, 264, [16,16], "%", 1.0, 0.0

    ; AFR target 16x16 — RPM max 14000 (v1.2.1)
    afrRpmBins       = array, U16, 520, [16], "RPM", 1.0, 0.0, 800, 14000
    afrLoadBins      = array, U16, 552, [16], "%", 1.0, 0.0
    afrTable         = array, U08, 584, [16,16], "AFR", 0.1, 0.0

    ; Spark advance 16x16 — RPM max 14000 (v1.2.1)
    advRpmBins       = array, U16, 840, [16], "RPM", 1.0, 0.0, 800, 14000
    advLoadBins      = array, U16, 872, [16], "%", 1.0, 0.0
    advTable         = array, S08, 904, [16,16], "deg", 0.5, 0.0

    ; Deadtime primary (8 pts)
    dtVbattBins      = array, U08, 1160, [8], "V", 0.1, 0.0
    dtMsCurve        = array, U08, 1168, [8], "ms", 0.05, 0.0

    ; Dwell 2D 4x4 (RPM x VBatt)
    dwRpmBins        = array, U16, 1176, [4], "RPM", 1.0, 0.0
    dwVbattBins      = array, U08, 1184, [4], "V", 0.1, 0.0
    dwTable          = array, U08, 1188, [4,4], "ms", 0.1, 0.0

    ; Idle duty vs CLT (8 pts)
    idleCltBins      = array, S08, 1204, [8], "C", 1.0, -40.0
    idleDutyCurve    = array, U08, 1212, [8], "%", 1.0, 0.0

    ; Cranking PW vs CLT (8 pts)
    crankCltBins     = array, U08, 1220, [8], "C", 1.0, -40.0
    crankPwCurve     = array, U08, 1228, [8], "ms", 0.1, 0.0

    ; Prime pulse vs CLT (6 pts)
    primeCltBins     = array, U08, 1236, [6], "C", 1.0, -40.0
    primeMsCurve     = array, U08, 1242, [6], "ms", 1.0, 0.0

    ; ASE (8 pts)
    aseTimeBins      = array, U08, 1248, [8], "s", 1.0, 0.0
    asePctCurve      = array, U08, 1256, [8], "%", 1.0, 0.0

    ; CLT calibration (8 pts)
    cltAdcBins       = array, U16, 1264, [8], "adc", 1.0, 0.0
    cltTempCurve     = array, U08, 1280, [8], "C", 1.0, -40.0

    ; IAT calibration (8 pts)
    iatAdcBins       = array, U16, 1288, [8], "adc", 1.0, 0.0
    iatTempCurve     = array, U08, 1304, [8], "C", 1.0, -40.0

    ; O2 calibration (8 pts)
    o2AdcBins        = array, U16, 1312, [8], "adc", 1.0, 0.0
    o2AfrCurve       = array, U08, 1328, [8], "AFR", 0.1, 0.0

    ; v1.2.0 — Dual injector stage2 fraction 16x16 (RPM x TPS)
    inj2FracRpmBins  = array, U16, 1336, [16], "RPM", 1.0, 0.0
    inj2FracLoadBins = array, U16, 1368, [16], "%", 1.0, 0.0
    inj2FracTable    = array, U08, 1400, [16,16], "frac", 0.01, 0.0  ; 0..1

    ; v1.2.0 — Stage2 deadtime (8 pts)
    inj2DtVbattBins  = array, U08, 1656, [8], "V", 0.1, 0.0
    inj2DtMsCurve    = array, U08, 1664, [8], "ms", 0.05, 0.0

    ; v1.2.0 — EWP PWM curve (8 pts)
    ewpCltBins       = array, U08, 1672, [8], "C", 1.0, -40.0
    ewpDutyCurve     = array, U08, 1680, [8], "%", 1.0, 0.0

    ; v1.2.0 — QS sensitivity per gear (6 pts)
    qsSensitivity    = array, U08, 1688, [6], "%", 1.0, 0.0
    qsCutGearBins    = array, U08, 1694, [6], "gear", 1.0, 0.0
    qsCutRpmBins     = array, U16, 1700, [8], "RPM", 1.0, 0.0
    qsCutTable       = array, U08, 1716, [6,8], "ms", 1.0, 0.0

    ; v1.2.0 — AE / CLT correction curves
    aeTpsdotBins     = array, U08, 1764, [8], "%/s", 1.0, 0.0
    aePctCurve       = array, U08, 1772, [8], "%", 1.0, 0.0
    cltCorrBins      = array, U08, 1780, [8], "C", 1.0, -40.0
    cltCorrPct       = array, U08, 1788, [8], "%", 1.0, 0.0

; ============================================================================
[OutputChannels]
; Realtime data — maps to LiveSnapshot fields dari CommsTask::sendRealtime
; ============================================================================
    secl           = scalar, U08,    0, "sec",    1.0, 0.0
    rpm            = scalar, U16,    2, "RPM",    1.0, 0.0
    tps            = scalar, U08,    4, "%",      1.0, 0.0
    clt            = scalar, S16,    6, "C",      1.0, -40.0
    iat            = scalar, S16,    8, "C",      1.0, -40.0
    o2Afr          = scalar, U16,   10, "AFR",    0.1, 0.0
    afrTarget      = scalar, U16,   12, "AFR",    0.1, 0.0
    vbatt          = scalar, U08,   14, "V",      0.1, 0.0
    pulseWidth     = scalar, U16,   16, "ms",     0.1, 0.0
    advance        = scalar, S16,   18, "deg",    0.5, 0.0
    dwellMs        = scalar, U16,   20, "ms",     0.1, 0.0
    idleDuty       = scalar, U08,   22, "%",      1.0, 0.0
    knockDb        = scalar, S16,   24, "dB",     0.5, -100.0
    knockCount     = scalar, U32,   26, "count",  1.0, 0.0
    knockRetard    = scalar, S16,   30, "deg",    0.5, 0.0
    ; v1.2.0 — knock detail
    knockFreqHz    = scalar, U16,   32, "Hz",     1.0, 0.0
    knockThreshold = scalar, S16,   34, "dB",     0.5, 0.0
    knockFloor     = scalar, S16,   36, "dB",     0.5, 0.0
    ; v1.2.0 — QS
    qsTriggerCount = scalar, U32,   38, "count", 1.0, 0.0
    qsCutActive    = scalar, U08,   42, "",       1.0, 0.0
    ; v1.2.0 — VVA
    vvaActive      = scalar, U08,   43, "",       1.0, 0.0
    ; v1.2.0 — Valvetronic
    vvActive       = scalar, U08,   44, "",       1.0, 0.0
    ; v1.2.0 — EWP
    ewpDuty        = scalar, U08,   45, "%",      1.0, 0.0
    ; v1.2.0 — CMP
    cmpSynced      = scalar, U08,   46, "",       1.0, 0.0
    ; umum
    tpsdot         = scalar, S16,   48, "%/s",    0.5, 0.0
    o2Trim         = scalar, S16,   50, "%",      0.5, 0.0
    revCount       = scalar, U32,   52, "rev",    1.0, 0.0
    startState     = scalar, U08,   56, "",       1.0, 0.0
    flags          = scalar, U16,   58, "",       1.0, 0.0

; ============================================================================
[TableEditor]
    tableEditor = "VE Table",       veTable,    veTable,    { veRpmBins, veLoadBins }
    tableEditor = "AFR Target",     afrTable,   afrTable,   { afrRpmBins, afrLoadBins }
    tableEditor = "Spark Advance",  advTable,   advTable,   { advRpmBins, advLoadBins }
    tableEditor = "Dwell 2D",       dwTable,    dwTable,    { dwRpmBins, dwVbattBins }
    tableEditor = "Stage2 Fraction", inj2FracTable, inj2FracTable, { inj2FracRpmBins, inj2FracLoadBins }
    tableEditor = "QS Cut Table",   qsCutTable,  qsCutTable,  { qsCutRpmBins, qsCutGearBins }
[CurveEditor]
    curveEditor = "Deadtime Primary",  dtMsCurve,    dtVbattBins
    curveEditor = "Deadtime Stage2",    inj2DtMsCurve, inj2DtVbattBins
    curveEditor = "Idle Duty vs CLT",   idleDutyCurve, idleCltBins
    curveEditor = "Cranking PW vs CLT", crankPwCurve, crankCltBins
    curveEditor = "Prime Pulse vs CLT", primeMsCurve, primeCltBins
    curveEditor = "ASE Enrichment",     asePctCurve,  aseTimeBins
    curveEditor = "CLT Calibration",    cltTempCurve, cltAdcBins
    curveEditor = "IAT Calibration",    iatTempCurve, iatAdcBins
    curveEditor = "O2 Calibration",     o2AfrCurve,   o2AdcBins
    curveEditor = "EWP PWM Curve",      ewpDutyCurve, ewpCltBins
    curveEditor = "AE vs TPSdot",       aePctCurve,   aeTpsdotBins
    curveEditor = "CLT Correction",     cltCorrPct,   cltCorrBins

[GaugeConfigurations]
    gaugeConfig = rpm,         "RPM",        0, 14000,  0, 14000,  0, 14000,  0, 0, 0
    gaugeConfig = tps,         "TPS",        0,   100,  0,  100,  0,  100,  0, 0, 0
    gaugeConfig = clt,         "CLT",      -40,   120,  0,  120,  0,  120,  0, 0, 0
    gaugeConfig = iat,         "IAT",      -40,   100,  0,  100,  0,  100,  0, 0, 0
    gaugeConfig = o2Afr,       "AFR",        7,    22,  0,   22,  0,   22,  0, 0, 0
    gaugeConfig = afrTarget,   "AFRt",       7,    22,  0,   22,  0,   22,  0, 0, 0
    gaugeConfig = vbatt,       "BAT",        8,    16,  0,   16,  0,   16,  0, 0, 0
    gaugeConfig = advance,     "ADV",      -10,    50,  0,   50,  0,   50,  0, 0, 0
    gaugeConfig = pulseWidth,  "PW",         0,    25,  0,   25,  0,   25,  0, 0, 0
    gaugeConfig = dwellMs,     "DWELL",      0,    10,  0,   10,  0,   10,  0, 0, 0
    gaugeConfig = idleDuty,    "IDLE",       0,   100,  0,  100,  0,  100,  0, 0, 0
    gaugeConfig = knockDb,     "KNOCK",    -60,    20,  0,   20,  0,   20,  0, 0, 0
    gaugeConfig = knockRetard, "KRET",     -20,     0,  0,    0,  0,    0,  0, 0, 0
    gaugeConfig = knockFreqHz, "KFREQ",      0, 20000,  0, 20000, 0, 20000, 0, 0, 0
    gaugeConfig = ewpDuty,     "EWP",        0,   100,  0,  100,  0,  100,  0, 0, 0
    gaugeConfig = qsCutActive, "QS CUT",     0,     1,  0,    1,  0,    1,  0, 0, 0
    gaugeConfig = vvaActive,   "VVA",        0,     1,  0,    1,  0,    1,  0, 0, 0
    gaugeConfig = vvActive,    "VV MOD",     0,     1,  0,    1,  0,    1,  0, 0, 0
    gaugeConfig = cmpSynced,   "CMP",        0,     1,  0,    1,  0,    1,  0, 0, 0

[FrontPage]
    frontPage = 4, 2
        gauge1 = rpm
        gauge2 = tps
        gauge3 = clt
        gauge4 = o2Afr

; ============================================================================
[Menu]
; ============================================================================
    menu = "Fuel"
        subMenu = "VE Table",            veTable
        subMenu = "AFR Target",          afrTable
        subMenu = "Fuel Constants",      std_fuel
        subMenu = "Cranking Fuel",       std_cranking_fuel
        subMenu = "Warmup Enrichment",  asePctCurve
        subMenu = "Accel Enrichment",    std_accel
        subMenu = "DFCO",                std_dfco
        subMenu = "Closed-Loop O2",      std_o2_pi

    menu = "Ignition"
        subMenu = "Spark Advance",       advTable
        subMenu = "Dwell",               dwTable
        subMenu = "Cranking Ignition",   std_cranking_ign
        subMenu = "Trigger / Pulser",    std_trigger
        subMenu = "Idle Control",        std_idle
        subMenu = "Idle Target Curve",   idleDutyCurve
        subMenu = "Rev Limit",           std_rev_limit

    menu = "Injector"
        subMenu = "Injector Setup",      std_injector
        subMenu = "Deadtime Primary",     dtMsCurve
        subMenu = "Dual Stage Setup",    std_dual_injector
        subMenu = "Stage2 Fraction Table", inj2FracTable
        subMenu = "Deadtime Stage2",     inj2DtMsCurve

    menu = "Knock"
        subMenu = "Knock Setup",         std_knock
        subMenu = "Knock Window",        std_knock_window
        subMenu = "Knock Retard",       std_knock_retard

    menu = "VVA"
        subMenu = "VVA Setup",           std_vva
        subMenu = "VVA Activation",     std_vva_activation

    menu = "Valvetronic"
        subMenu = "Valvetronic Setup",   std_valvetronic

    menu = "Coolant Pump"
        subMenu = "EWP Setup",           std_ewp
        subMenu = "EWP PWM Curve",       ewpDutyCurve

    menu = "Quickshifter"
        subMenu = "QS Setup",            std_qs
        subMenu = "QS Cut Table",        qsCutTable
        subMenu = "QS Sensor Calibration", std_qs_cal

    menu = "CMP / Cam Sensor"
        subMenu = "CMP Setup",           std_cmp

    menu = "Sensors"
        subMenu = "TDC Offset + Trigger", std_tdc_trigger
        subMenu = "CLT Calibration",    cltTempCurve
        subMenu = "IAT Calibration",    iatTempCurve
        subMenu = "TPS Calibration",    std_tps_cal
        subMenu = "O2 / Wideband",       o2AfrCurve

    menu = "Engine Constants"
        subMenu = "Required Fuel",       std_engine
